name: ShareMount
options:
  bundleIdPrefix: io.github.jhdev01
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ShareMount:
    type: application
    platform: macOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jhdev01.ShareMount
        PRODUCT_NAME: ShareMount
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox is intentionally OFF: a sandboxed app can't freely mount
        # arbitrary network shares via NetFS. This is a personal tool, not for
        # the Mac App Store.
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - sdk: NetFS.framework
      - sdk: ServiceManagement.framework

  # Unit tests for the pure-Foundation parsing code. The files under test are
  # compiled straight into the test bundle (no app host), so the tests run
  # without launching the menu bar app or needing code signing.
  ShareMountTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Models/Share.swift
      - path: Sources/Models/MountSource.swift
      - path: Sources/Models/Credentials.swift
      - path: Sources/Models/SMBShareList.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jhdev01.ShareMountTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  ShareMount:
    build:
      targets:
        ShareMount: all
        ShareMountTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShareMountTests
