name: ShareMount
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ShareMount:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShareMount
        PRODUCT_NAME: ShareMount
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox is intentionally OFF: a sandboxed app can't freely mount
        # arbitrary network shares via NetFS. This is a personal tool, not for
        # the Mac App Store.
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - sdk: NetFS.framework
      - sdk: ServiceManagement.framework
